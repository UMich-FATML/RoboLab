# Semantic annotations for the scene generator (robolab/scene_gen/).
#
# Only semantics live here: display name, category (drives vague instructions
# and template slot selection) and color (drives color-axis distractors).
# Physical roles — container, flat support, graspable, stable poses — are
# derived from the mesh by robolab/scene_gen/geometry.py and never hand-set.
# An object absent from this file is never sampled.
#
# Fields: display (noun phrase), category, color, plural (optional).

